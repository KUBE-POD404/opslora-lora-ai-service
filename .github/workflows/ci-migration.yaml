name: Migration Check

on:
  workflow_call:
    outputs:
      migration_status:
        value: ${{ jobs.migration.outputs.migration_status }}
      failure_stage:
        value: ${{ jobs.migration.outputs.failure_stage }}
      report_url:
        value: ${{ jobs.migration.outputs.report_url }}

jobs:
  migration:
    runs-on: ubuntu-latest
    outputs:
      migration_status: ${{ steps.result.outputs.status }}
      failure_stage: ${{ steps.failure.outputs.stage }}
      report_url: ${{ steps.report.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run Alembic migrations
        id: migrate
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./ci_lora_ai_migrations.db
          ENABLE_AZURE_FOUNDRY_FALLBACK: "false"
        run: python -m alembic upgrade head
      - id: report
        if: always()
        run: echo "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - id: failure
        if: always()
        run: |
          if [ "${{ steps.install.outcome }}" = "failure" ]; then
            echo "stage=dependency_install_failed" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.migrate.outcome }}" = "failure" ]; then
            echo "stage=alembic_upgrade_failed" >> "$GITHUB_OUTPUT"
          else
            echo "stage=success" >> "$GITHUB_OUTPUT"
          fi
      - id: result
        if: always()
        run: |
          if [ "${{ steps.install.outcome }}" = "failure" ] || [ "${{ steps.migrate.outcome }}" = "failure" ]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi
