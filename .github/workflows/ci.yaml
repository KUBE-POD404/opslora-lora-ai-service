name: Lora AI Pipeline

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: opslora-lora-ai-service-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  get-email:
    runs-on: ubuntu-latest
    outputs:
      email: ${{ steps.author.outputs.email }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: author
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          EMAIL=$(git show -s --format='%ae' "$SHA" || echo "")
          echo "email=$EMAIL" >> "$GITHUB_OUTPUT"

  unit-tests:
    uses: ./.github/workflows/ci-test.yaml

  migration-check:
    uses: ./.github/workflows/ci-migration.yaml
    secrets: inherit

  sonar-scan:
    needs: [unit-tests, migration-check]
    uses: ./.github/workflows/ci-sonar-check.yaml
    secrets: inherit

  snyk-scan:
    needs: sonar-scan
    uses: ./.github/workflows/ci-snyk-check.yaml
    secrets: inherit

  notify:
    needs: [unit-tests, migration-check, sonar-scan, snyk-scan, get-email]
    if: ${{ always() &&
      (needs.unit-tests.result == 'failure' ||
       needs.migration-check.result == 'failure' ||
       needs.sonar-scan.outputs.quality_gate_status == 'FAILED' ||
       needs.snyk-scan.outputs.snyk_status == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit Test Notification
        if: ${{ needs.unit-tests.result == 'failure' }}
        uses: ./.github/actions/notification-action
        with:
          pipeline_name: ${{ github.workflow }}
          repository_name: ${{ github.repository }}
          failure_reason: ${{ needs.unit-tests.outputs.failure_stage }}
          author: ${{ github.event.pull_request.user.login }}
          smtp_username: ${{ secrets.SMTP_USERNAME }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
          mail_from: ${{ secrets.MAIL_FROM }}
          mail_to: ${{ needs.get-email.outputs.email }}
          slack_webhook: ${{ secrets.SLACK_INCOMING_WEBHOOK }}
          workflow_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          report_url: ${{ needs.unit-tests.outputs.report_url }}

      - name: Migration Check Notification
        if: ${{ needs.migration-check.result == 'failure' }}
        uses: ./.github/actions/notification-action
        with:
          pipeline_name: ${{ github.workflow }}
          repository_name: ${{ github.repository }}
          failure_reason: ${{ needs.migration-check.outputs.failure_stage }}
          author: ${{ github.event.pull_request.user.login }}
          smtp_username: ${{ secrets.SMTP_USERNAME }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
          mail_from: ${{ secrets.MAIL_FROM }}
          mail_to: ${{ needs.get-email.outputs.email }}
          slack_webhook: ${{ secrets.SLACK_INCOMING_WEBHOOK }}
          workflow_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          report_url: ${{ needs.migration-check.outputs.report_url }}

      - name: Sonar Notification
        if: ${{ needs.sonar-scan.outputs.quality_gate_status == 'FAILED' }}
        uses: ./.github/actions/notification-action
        with:
          pipeline_name: ${{ github.workflow }}
          repository_name: ${{ github.repository }}
          failure_reason: ${{ needs.sonar-scan.outputs.notify_summary }}
          author: ${{ github.event.pull_request.user.login }}
          smtp_username: ${{ secrets.SMTP_USERNAME }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
          mail_from: ${{ secrets.MAIL_FROM }}
          mail_to: ${{ needs.get-email.outputs.email }}
          slack_webhook: ${{ secrets.SLACK_INCOMING_WEBHOOK }}
          workflow_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          report_url: https://sonarcloud.io/dashboard?id=${{ vars.SONAR_PROJECT_KEY || github.event.repository.name }}

      - name: Snyk Notification
        if: ${{ needs.snyk-scan.outputs.snyk_status == 'failure' }}
        uses: ./.github/actions/notification-action
        with:
          pipeline_name: ${{ github.workflow }}
          repository_name: ${{ github.repository }}
          failure_reason: ${{ needs.snyk-scan.outputs.notify_summary }}
          author: ${{ github.event.pull_request.user.login }}
          smtp_username: ${{ secrets.SMTP_USERNAME }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
          mail_from: ${{ secrets.MAIL_FROM }}
          mail_to: ${{ needs.get-email.outputs.email }}
          slack_webhook: ${{ secrets.SLACK_INCOMING_WEBHOOK }}
          workflow_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          report_url: https://app.snyk.io
